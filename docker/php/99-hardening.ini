; Hardening de PHP para fb-downloader (copia-production + ajustes)
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
; Sin error_log definido, mod_php escribe en el error log de Apache.

ignore_repeated_source = Off
memory_limit = 256M
max_execution_time = 60
max_input_time = 60
max_input_vars = 200
post_max_size = 2M
upload_max_filesize = 1M
max_file_uploads = 1
max_input_nesting_level = 32

zlib.output_compression = Off

; Sesiones con configuración conservadora
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax

; El código solo puede leer el árbol de la aplicación y /tmp.
open_basedir = /var/www:/tmp:/dev/null

; Código inmutable: opcache sin validar mtime
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.enable_cli = 0
